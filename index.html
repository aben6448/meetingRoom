<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>17层会议室预订系统</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="app-header">
            <h1>📅 17层会议室</h1>
        </header>

        <!-- 快速预订按钮 -->
        <button class="quick-book-btn" onclick="showQuickBookModal()">➕ 快速预订</button>

        <!-- 周导航 -->
        <div class="week-nav">
            <button class="nav-btn" id="prevWeek">‹ 上周</button>
            <div class="week-title" id="weekTitle">本周</div>
            <button class="nav-btn" id="nextWeek">下周 ›</button>
        </div>

        <!-- 日期标签页 -->
        <div class="date-tabs" id="dateTabs">
            <!-- 由JS动态生成 -->
        </div>

        <!-- 时间段列表 -->
        <div class="time-slots" id="timeSlots">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle"></span>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalBody">
                <!-- 由JS动态生成 -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
